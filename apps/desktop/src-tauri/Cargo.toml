[package]
name = "vmui-desktop"
version = "0.1.0"
description = "vmui — tray + control window for the home stack"
authors = ["Dragos Catalin Vladulescu"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "vmui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tungstenite = "0.30"
ureq = { version = "3", features = ["json"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
